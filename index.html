<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커튼 견적 계산기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',sans-serif;background:#eef1f5;color:#333;min-height:100vh}
header{background:#1e3a5f;color:#fff;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header h1{font-size:19px;letter-spacing:-0.3px}
.admin-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 15px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.admin-btn:hover{background:rgba(255,255,255,.25)}
.tabs{background:#fff;display:flex;overflow-x:auto;border-bottom:2px solid #dde3ec;padding:0 12px}
.tab{padding:13px 18px;cursor:pointer;font-size:13.5px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;color:#666;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;transition:color .2s}
.tab.active{border-bottom-color:#1e3a5f;color:#1e3a5f;font-weight:700}
.tab:hover:not(.active){background:#f5f7fa;color:#333}
.main{display:flex;gap:16px;padding:16px;max-width:1380px;margin:0 auto}
.calc-area{flex:1;min-width:0}
.sidebar{width:320px;flex-shrink:0}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.09);margin-bottom:14px}
.card-title{font-size:15px;color:#1e3a5f;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #eaf0f9}
.tab-content{display:none}
.tab-content.active{display:block}
.form-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.form-group{flex:1;min-width:120px;margin-bottom:0}
.form-group.full{flex:100%}
label{display:block;font-size:12px;color:#555;margin-bottom:4px;font-weight:600}
input[type=number],input[type=text],select{width:100%;padding:8px 11px;border:1.5px solid #d8dde5;border-radius:6px;font-size:13.5px;font-family:inherit;transition:border-color .2s}
input:focus,select:focus{outline:none;border-color:#1e3a5f;box-shadow:0 0 0 3px rgba(30,58,95,.1)}
.result-box{background:#f4f7fb;border-radius:8px;padding:14px 16px;margin-top:14px;border:1px solid #dde5f0}
.result-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:#444}
.result-row.total{border-top:2px solid #1e3a5f;margin-top:8px;padding-top:10px;font-weight:700;font-size:16px;color:#1e3a5f}
.btn{padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13.5px;font-family:inherit;font-weight:600;transition:background .2s}
.btn-primary{background:#1e3a5f;color:#fff}
.btn-primary:hover{background:#162d4a}
.btn-add{background:#1a7a4a;color:#fff;width:100%;margin-top:13px;padding:11px}
.btn-add:hover{background:#15603b}
.btn-danger{background:#c0392b;color:#fff;font-size:12px;padding:5px 11px;border-radius:5px}
.btn-danger:hover{background:#a93226}
.btn-secondary{background:#5a6475;color:#fff}
.btn-secondary:hover{background:#444d5c}
.opts-title{font-size:12.5px;font-weight:700;color:#444;margin:14px 0 8px}
.opt-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f8f9fc;border-radius:6px;margin-bottom:5px;border:1px solid #eaecf2}
.opt-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;flex-shrink:0}
.opt-item label{margin:0;font-size:13px;font-weight:400;cursor:pointer;flex:1}
.opt-qty{width:65px!important;padding:5px 7px!important;font-size:12.5px!important}
.quote-item{background:#f4f7fb;border-radius:8px;padding:11px 13px;margin-bottom:7px;border-left:4px solid #1e3a5f}
.qi-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.qi-name{font-weight:700;font-size:13.5px;color:#1e3a5f;flex:1}
.qi-price{font-weight:700;font-size:14px;color:#1a7a4a;white-space:nowrap}
.qi-detail{font-size:11.5px;color:#777}
.grand-total{background:#1e3a5f;color:#fff;border-radius:8px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-top:10px}
.empty-msg{text-align:center;color:#aaa;padding:24px;font-size:13px}
.print-area{display:flex;gap:8px;margin-top:10px}
/* Admin */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:900}
.overlay.open{display:block}
.admin-panel{position:fixed;top:0;right:-480px;width:460px;height:100vh;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.18);z-index:1000;transition:right .3s;overflow-y:auto}
.admin-panel.open{right:0}
@media(max-width:480px){
  .admin-panel{width:100vw;right:-100vw}
  .admin-panel.open{right:0}
  .pi{flex-wrap:wrap}
  .pi input[type=number]{width:90px}
  .add-row{flex-wrap:wrap}
  .add-row input{min-width:0}
}
.admin-hdr{background:#1e3a5f;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.admin-hdr h2{font-size:15px}
.close-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.adm-sec{padding:15px 18px;border-bottom:1px solid #eee}
.adm-sec h3{font-size:13px;font-weight:700;color:#1e3a5f;margin-bottom:10px;padding:5px 8px;background:#eaf0f9;border-radius:4px}
.adm-sec h4{font-size:12px;font-weight:700;color:#555;margin:10px 0 6px}
.pi{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.pi input[type=text]{flex:1}
.pi input[type=number]{width:110px}
.pi .unit{font-size:11px;color:#888;white-space:nowrap}
.add-row{display:flex;gap:7px;margin-top:8px}
.add-row input{flex:1}
@media print{
  header,.tabs,.calc-area,.admin-panel,.overlay,.admin-btn,.print-area{display:none!important}
  .sidebar{width:100%!important}
  .main{padding:0}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
}
@media(max-width:800px){.main{flex-direction:column}.sidebar{width:100%}}
</style>
</head>
<body>

<header>
  <h1>커튼 견적 계산기</h1>
  <button class="admin-btn" onclick="openAdmin()">⚙ 관리자 설정</button>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('sokji',this)">속지커튼</button>
  <button class="tab" onclick="switchTab('ammak',this)">암막커튼</button>
  <button class="tab" onclick="switchTab('nabi',this)">나비주름</button>
  <button class="tab" onclick="switchTab('blind',this)">블라인드</button>
  <button class="tab" onclick="switchTab('rail',this)">전동레일</button>
</div>

<div class="main">
  <div class="calc-area">

    <!-- 속지커튼 -->
    <div class="tab-content active card" id="tab-sokji">
      <div class="card-title">속지커튼 견적</div>
      <div class="form-row">
        <div class="form-group">
          <label>가로 (mm)</label>
          <input type="number" id="s-width" placeholder="예: 2388" oninput="calcSokji()">
        </div>
        <div class="form-group">
          <label>원단 선택</label>
          <select id="s-fabric" onchange="calcSokji()"></select>
        </div>
      </div>
      <div class="result-box" id="s-result" style="display:none">
        <div class="result-row"><span>야드수</span><span id="s-yards"></span></div>
        <div class="result-row total"><span>견적금액</span><span id="s-total"></span></div>
      </div>
      <button class="btn btn-add" onclick="addQuote('sokji')">+ 견적에 추가</button>
    </div>

    <!-- 암막커튼 -->
    <div class="tab-content card" id="tab-ammak">
      <div class="card-title">암막커튼 견적</div>
      <div class="form-row">
        <div class="form-group">
          <label>가로 (mm)</label>
          <input type="number" id="a-width" placeholder="예: 4500" oninput="calcAmmak()">
        </div>
        <div class="form-group">
          <label>원단 선택</label>
          <select id="a-fabric" onchange="calcAmmak()"></select>
        </div>
      </div>
      <div class="result-box" id="a-result" style="display:none">
        <div class="result-row"><span>폭수</span><span id="a-panels"></span></div>
        <div class="result-row total"><span>견적금액</span><span id="a-total"></span></div>
      </div>
      <button class="btn btn-add" onclick="addQuote('ammak')">+ 견적에 추가</button>
    </div>

    <!-- 나비주름 -->
    <div class="tab-content card" id="tab-nabi">
      <div class="card-title">나비주름 견적</div>
      <div class="form-row">
        <div class="form-group">
          <label>종류</label>
          <select id="n-type" onchange="calcNabi()">
            <option value="소폭">소폭나비</option>
            <option value="대폭">대폭나비</option>
          </select>
        </div>
        <div class="form-group">
          <label>가로 (mm)</label>
          <input type="number" id="n-width" placeholder="예: 3000" oninput="calcNabi()">
        </div>
        <div class="form-group">
          <label>원단 선택</label>
          <select id="n-fabric" onchange="calcNabi()"></select>
        </div>
      </div>
      <div class="result-box" id="n-result" style="display:none">
        <div class="result-row"><span>종류</span><span id="n-type-r"></span></div>
        <div class="result-row"><span>폭수</span><span id="n-panels"></span></div>
        <div class="result-row total"><span>견적금액</span><span id="n-total"></span></div>
      </div>
      <button class="btn btn-add" onclick="addQuote('nabi')">+ 견적에 추가</button>
    </div>

    <!-- 블라인드 -->
    <div class="tab-content card" id="tab-blind">
      <div class="card-title">블라인드 견적</div>
      <div class="form-row">
        <div class="form-group">
          <label>블라인드 종류</label>
          <select id="b-type" onchange="onBlindTypeChange()">
            <option value="롤스크린">롤스크린</option>
            <option value="콤비블라인드">콤비블라인드</option>
            <option value="트리플블라인드">트리플블라인드</option>
            <option value="허니콤블라인드">허니콤블라인드</option>
            <option value="알루미늄블라인드">알루미늄블라인드</option>
            <option value="우드블라인드">우드블라인드</option>
          </select>
        </div>
        <div class="form-group">
          <label>단가 선택</label>
          <select id="b-fabric" onchange="calcBlind()"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>가로 (cm)</label>
          <input type="number" id="b-width" placeholder="예: 150" oninput="calcBlind()">
        </div>
        <div class="form-group">
          <label>세로 (cm)</label>
          <input type="number" id="b-height" placeholder="예: 200" oninput="calcBlind()">
        </div>
      </div>
      <div class="opts-title">부가서비스</div>
      <div id="b-opts"></div>
      <div class="result-box" id="b-result" style="display:none">
        <div class="result-row"><span>회배</span><span id="b-cov"></span></div>
        <div class="result-row"><span>원단금액</span><span id="b-fab-cost"></span></div>
        <div class="result-row"><span>시공비</span><span id="b-install"></span></div>
        <div class="result-row"><span>부가서비스</span><span id="b-extra"></span></div>
        <div class="result-row total"><span>견적금액</span><span id="b-total"></span></div>
      </div>
      <button class="btn btn-add" onclick="addQuote('blind')">+ 견적에 추가</button>
    </div>

    <!-- 전동레일 -->
    <div class="tab-content card" id="tab-rail">
      <div class="card-title">전동레일 견적</div>
      <div class="form-row">
        <div class="form-group">
          <label>레일 종류</label>
          <select id="r-type" onchange="calcRail()"></select>
        </div>
        <div class="form-group" style="max-width:120px">
          <label>수량</label>
          <input type="number" id="r-qty" value="1" min="1" oninput="calcRail()">
        </div>
      </div>
      <div class="result-box" id="r-result" style="display:none">
        <div class="result-row"><span>단가</span><span id="r-unit"></span></div>
        <div class="result-row"><span>수량</span><span id="r-qty-r"></span></div>
        <div class="result-row total"><span>견적금액</span><span id="r-total"></span></div>
      </div>
      <button class="btn btn-add" onclick="addQuote('rail')">+ 견적에 추가</button>
    </div>

  </div><!-- /calc-area -->

  <!-- 견적 사이드바 -->
  <div class="sidebar">
    <div class="card">
      <div class="card-title">견적 목록</div>
      <div id="quote-list"><div class="empty-msg">추가된 항목이 없습니다.</div></div>
      <div id="quote-footer" style="display:none">
        <div class="grand-total">
          <span>총 견적금액</span>
          <span id="grand-total-val"></span>
        </div>
        <div class="print-area">
          <button class="btn btn-primary" onclick="window.print()" style="flex:1">인쇄</button>
          <button class="btn btn-danger" onclick="clearAll()">전체삭제</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /main -->

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeAdmin()"></div>

<!-- Admin Panel -->
<div class="admin-panel" id="admin-panel">
  <div class="admin-hdr">
    <h2>⚙ 관리자 설정</h2>
    <button class="close-btn" onclick="closeAdmin()">✕</button>
  </div>
  <div id="admin-body"></div>
</div>

<script>
// ─── DEFAULT CONFIG ───────────────────────────────────────────
const DEFAULT = {
  sokji:{
    fabrics:[
      {name:'기본속지A', price:10500},
      {name:'고급속지B', price:15000}
    ],
    fees:[
      {maxW:2398, fee:70000},
      {maxW:4800, fee:80000},
      {maxW:99999, fee:90000}
    ]
  },
  ammak:{
    fabrics:[
      {name:'기본암막', price:30000},
      {name:'고급암막', price:45000}
    ],
    fees:[
      {maxP:1, fee:60000},
      {maxP:3, fee:70000},
      {maxP:5, fee:80000},
      {maxP:99, fee:85000}
    ]
  },
  nabi:{
    fabrics:[
      {name:'기본나비', price:20000},
      {name:'고급나비', price:30000}
    ]
  },
  blind:{
    typeInfo:{
      '롤스크린':      {cov:1, baseH:150},
      '콤비블라인드':  {cov:1, baseH:150},
      '트리플블라인드':{cov:1, baseH:150},
      '허니콤블라인드':{cov:1, baseH:null},
      '알루미늄블라인드':{cov:1,baseH:null},
      '우드블라인드':  {cov:1, baseH:150}
    },
    fabrics:{
      '롤스크린':      [{name:'기본롤', price:15000}],
      '콤비블라인드':  [{name:'기본콤비', price:20000}],
      '트리플블라인드':[{name:'기본트리플', price:25000}],
      '허니콤블라인드':[{name:'기본허니콤', price:30000}],
      '알루미늄블라인드':[{name:'기본알루미늄', price:18000}],
      '우드블라인드':  [{name:'기본우드', price:35000}]
    },
    fees:[
      {maxW:160, fee:30000},
      {maxW:200, fee:40000},
      {maxW:240, fee:50000}
    ],
    extras:{
      '롤스크린':[
        {id:'jb',  name:'점보봉',  unit:'m',  price:6000},
        {id:'tc',  name:'상단카바', unit:'m',  price:6000},
        {id:'sb',  name:'사각바',  unit:'m',  price:5000}
      ],
      '콤비블라인드':[
        {id:'jb',  name:'점보봉',  unit:'m',  price:6000},
        {id:'tc',  name:'상단카바', unit:'m',  price:6000},
        {id:'sb',  name:'사각바',  unit:'m',  price:5000},
        {id:'cj',  name:'콤비줄',  unit:'개', price:1500}
      ],
      '트리플블라인드':[
        {id:'jb',  name:'점보봉',  unit:'m',  price:6000},
        {id:'tc',  name:'상단카바', unit:'m',  price:6000},
        {id:'sb',  name:'사각바',  unit:'m',  price:5000}
      ],
      '허니콤블라인드':[
        {id:'std', name:'심플 탑다운',  unit:'창', price:11000},
        {id:'oc',  name:'원코드',       unit:'창', price:13500},
        {id:'oct', name:'원코드 탑다운',unit:'창', price:24500},
        {id:'sa',  name:'반자동',       unit:'창', price:20000},
        {id:'sat', name:'반자동 탑다운',unit:'창', price:38000},
        {id:'cz',  name:'코드제로',     unit:'창', price:20000}
      ],
      '알루미늄블라인드':[
        {id:'mx',  name:'믹스', unit:'회배', price:2200}
      ],
      '우드블라인드':[
        {id:'rd',  name:'라운드', unit:'회배', price:2200},
        {id:'mx',  name:'믹스',   unit:'회배', price:2800},
        {id:'rb',  name:'리본 추가', unit:'창', price:20000}
      ]
    }
  },
  rail:{
    items:[
      {name:'조절전동300', price:180000},
      {name:'조절전동450', price:190000},
      {name:'조절전동520', price:220000},
      {name:'제작전동300', price:210000},
      {name:'제작전동400', price:220000},
      {name:'제작전동500', price:230000}
    ]
  }
};

// ─── CONFIG LOAD/SAVE ────────────────────────────────────────
let C;
function loadC(){
  try{ C = JSON.parse(localStorage.getItem('curtainCfg')) || deepCopy(DEFAULT); }
  catch(e){ C = deepCopy(DEFAULT); }
}
function saveC(){ localStorage.setItem('curtainCfg', JSON.stringify(C)); }
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function resetC(){
  if(!confirm('모든 설정을 초기값으로 리셋하겠습니까?')) return;
  C = deepCopy(DEFAULT); saveC(); initAll(); renderAdmin(); alert('초기화 완료');
}

// ─── UTILS ───────────────────────────────────────────────────
function won(n){ return Math.round(n).toLocaleString('ko-KR')+'원'; }
function r2(n){ return Math.round(n*100)/100; }           // 소수점 2자리 반올림
function ceil1(n){ return Math.ceil(n*10)/10; }            // 소수점 1자리 올림
function r100(n){ return Math.round(n/100)*100; }          // 백원단위 반올림
function nabiRound(n){                                     // 나비주름 전용 반올림
  const f=Math.floor(n);
  return (n-f)>=0.3 ? f+1 : f;
}

// ─── TABS ────────────────────────────────────────────────────
function switchTab(name, el){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
}

// ─── QUOTE LIST ──────────────────────────────────────────────
let quotes=[];
function renderQuotes(){
  const el=document.getElementById('quote-list');
  const ft=document.getElementById('quote-footer');
  if(!quotes.length){
    el.innerHTML='<div class="empty-msg">추가된 항목이 없습니다.</div>';
    ft.style.display='none'; return;
  }
  let total=0;
  el.innerHTML=quotes.map((q,i)=>{
    total+=q.price;
    return `<div class="quote-item">
      <div class="qi-header">
        <div class="qi-name">${q.name}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="qi-price">${won(q.price)}</div>

// ─── 속지커튼 ────────────────────────────────────────────────
function initSokji(){

  sel.innerHTML=C.sokji.fabrics.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');
  calcSokji();
}
function getSokjiInstall(w){
  for(const f of C.sokji.fees) if(w<=f.maxW) return f.fee;
  return C.sokji.fees[C.sokji.fees.length-1].fee;
}
function calcSokji(){
  const w=+document.getElementById('s-width').value;
  const fi=+document.getElementById('s-fabric').value;
  if(!w||w<=0){ document.getElementById('s-result').style.display='none'; return; }
  const fab=C.sokji.fabrics[fi];
  const yards=r2((w+200)*2/900);
  const fee=getSokjiInstall(w);
  const total=r100(yards*fab.price+fee);
  document.getElementById('s-yards').textContent=yards+'야드';
  document.getElementById('s-total').textContent=won(total);
  document.getElementById('s-result').style.display='block';
}
function makeSokji(){
  const w=+document.getElementById('s-width').value;
  if(!w||w<=0){ alert('가로 사이즈를 입력해주세요.'); return null; }
  const fi=+document.getElementById('s-fabric').value;
  const fab=C.sokji.fabrics[fi];
  const yards=r2((w+200)*2/900);
  const fee=getSokjiInstall(w);
  const total=r100(yards*fab.price+fee);
  return {name:`속지커튼 - ${fab.name}`, price:total,
    detail:`가로 ${w.toLocaleString()}mm · ${yards}야드`};
}

// ─── 암막커튼 ────────────────────────────────────────────────

function getPanels(w){
  if(w<=1000) return 1; if(w<=2000) return 2; if(w<=3000) return 3;
  if(w<=4000) return 4; if(w<=5000) return 5; if(w<=6000) return 6;
  if(w<=7000) return 7; return 8;
}
function getAmmakFee(p){
  for(const f of C.ammak.fees) if(p<=f.maxP) return f.fee;
  return C.ammak.fees[C.ammak.fees.length-1].fee;
}
function calcAmmak(){
  const w=+document.getElementById('a-width').value;
  const fi=+document.getElementById('a-fabric').value;
  if(!w||w<=0){ document.getElementById('a-result').style.display='none'; return; }
  const fab=C.ammak.fabrics[fi];

  const fee=getAmmakFee(panels);
  const total=panels*fab.price+fee;
  document.getElementById('a-panels').textContent=panels+'폭';
  document.getElementById('a-total').textContent=won(total);
  document.getElementById('a-result').style.display='block';
}
function makeAmmak(){

// ─── 블라인드 ────────────────────────────────────────────────
function initBlind(){ updateBlindFabric(); renderBlindOpts(); calcBlind(); }
function onBlindTypeChange(){ updateBlindFabric(); renderBlindOpts(); calcBlind(); }
function updateBlindFabric(){
  const type=document.getElementById('b-type').value;
  const sel=document.getElementById('b-fabric');
  const list=C.blind.fabrics[type]||[];
  sel.innerHTML=list.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');
}
function renderBlindOpts(){
  const type=document.getElementById('b-type').value;
  const extras=C.blind.extras[type]||[];
  const el=document.getElementById('b-opts');
  if(!extras.length){ el.innerHTML='<div style="color:#aaa;font-size:12.5px">부가서비스 없음</div>'; return; }
  el.innerHTML=extras.map(e=>{
    const needQty=(e.unit==='개'||e.unit==='창');
    return `<div class="opt-item">
      <input type="checkbox" id="ex-${e.id}" onchange="calcBlind()">
      <label for="ex-${e.id}">${e.name}<span style="color:#888;font-size:11.5px"> (${e.unit}당 ${e.price.toLocaleString()}원)</span></label>
      ${needQty?`<input type="number" class="opt-qty" id="exq-${e.id}" value="1" min="1" oninput="calcBlind()" placeholder="수량">`:''}
    </div>`;
  }).join('');
}
function getBlindInstallFee(wcm){
  for(const f of C.blind.fees) if(wcm<=f.maxW) return f.fee;
  return C.blind.fees[C.blind.fees.length-1].fee;
}
function calcBlindCore(){
  const type=document.getElementById('b-type').value;
  const wcm=+document.getElementById('b-width').value;
  const hcm=+document.getElementById('b-height').value;
  const fi=+document.getElementById('b-fabric').value;
  if(!wcm||wcm<=0||!hcm||hcm<=0) return null;
  const ti=C.blind.typeInfo[type];
  const fab=C.blind.fabrics[type]?.[fi];
  if(!fab) return null;
  const effH=ti.baseH?Math.max(hcm,ti.baseH):hcm;
  const cov=ceil1((wcm/100)*(effH/100)*ti.cov);
  const fabCost=cov*fab.price;
  const install=getBlindInstallFee(wcm);
  const extras=C.blind.extras[type]||[];
  let extraCost=0, extraNames=[];
  extras.forEach(e=>{
    const cb=document.getElementById('ex-'+e.id);
    if(cb&&cb.checked){
      const qel=document.getElementById('exq-'+e.id);
      const qty=qel?+qel.value||1:1;
      let cost=0;
      if(e.unit==='m')     cost=(wcm/100)*e.price;
      else if(e.unit==='회배') cost=cov*e.price;
      else                 cost=qty*e.price;
      extraCost+=cost; extraNames.push(e.name);
    }
  });
  return {type,fab,cov,fabCost,install,extraCost,extraNames,total:fabCost+install+extraCost,wcm,hcm};
}
function calcBlind(){
  const d=calcBlindCore();
  if(!d){ document.getElementById('b-result').style.display='none'; return; }
  document.getElementById('b-cov').textContent=d.cov+'회배';
  document.getElementById('b-fab-cost').textContent=won(d.fabCost);
  document.getElementById('b-install').textContent=won(d.install);
  document.getElementById('b-extra').textContent=won(d.extraCost);
  document.getElementById('b-total').textContent=won(d.total);
  document.getElementById('b-result').style.display='block';
}
function makeBlind(){
  const d=calcBlindCore();
  if(!d){ alert('가로/세로 사이즈를 입력해주세요.'); return null; }
  let det=`${d.wcm}×${d.hcm}cm · 회배 ${d.cov}`;
  if(d.extraNames.length) det+=' · '+d.extraNames.join(', ');
  return {name:`${d.type} - ${d.fab.name}`, price:d.total, detail:det};
}
